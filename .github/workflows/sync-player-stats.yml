name: Sync Player Stats

on:
  schedule:
    # Offset 10 minutes after the top-5000 scraper's own 00:18/06:18/12:18/18:18
    # Europe/Warsaw runs (woocash88/dota2-pl-leaderboard). That scraper matches
    # its JSON rows against ours by exact name, and only skips deleting a stale
    # official-only entry when it has a steam_id — so a player renamed since
    # the scraper's last pass (see cleanupRenameGhosts in sync-player-stats.mjs)
    # is briefly a name the scraper won't recognize, and it inserts a fresh
    # ghost duplicate for the old one. Running shortly after each of the
    # scraper's four passes keeps that window well under an hour.
    #
    # GitHub Actions cron is UTC-only, and Warsaw alternates CEST (UTC+2) /
    # CET (UTC+1), so two entries are needed to keep 00:28/06:28/12:28/18:28
    # Warsaw time year-round. The Apr-Oct / Nov-Mar split approximates the
    # actual last-Sunday-of-March/October DST switch — off by up to an hour
    # only in the transition week itself, which doesn't matter here.
    - cron: '28 4,10,16,22 * 4-10 *'      # Apr-Oct (CEST, UTC+2)
    - cron: '28 5,11,17,23 * 11,12,1,2,3 *' # Nov-Mar (CET, UTC+1)
  workflow_dispatch: {}

  # The version of the above that does not rely on a guess, inert until the
  # scraper calls it.
  #
  # Ten minutes is an estimate about a best-effort scheduler — GitHub makes no
  # promise about when a scheduled run actually starts, so a badly delayed
  # scraper can still finish after our pass and re-open the window the offset
  # exists to close. A dispatch sent when the scraper *has finished* replaces
  # "probably long enough" with "afterwards".
  #
  # The scraper repo already accepts repository_dispatch from us, so only the
  # reverse call is missing. Add a final step to
  # woocash88/dota2-pl-leaderboard/.github/workflows/update.yml:
  #
  #   - name: Tell the site to re-sync
  #     run: |
  #       curl -X POST -H "Accept: application/vnd.github+json" \
  #         -H "Authorization: Bearer ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}" \
  #         https://api.github.com/repos/Cienszki/dota2-community-site/dispatches \
  #         -d '{"event_type":"leaderboard-updated"}'
  #
  # The token needs only `repo` scope on this repository. The cron above stays
  # as the safety net for a scraper run that fails before reaching that step.
  repository_dispatch:
    types: [leaderboard-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-player-stats.mjs

      - name: Revalidate /ranking
        # /ranking is cached (see `revalidate` export in src/app/ranking/page.tsx)
        # so visitors don't hit Supabase on every request — this makes the new
        # data visible within seconds instead of waiting for that cache's own
        # 6h fallback. INHOUSE_SITE_URL is the same secret inhouse-ingest.yml
        # already uses; it's just the site's base URL despite the name.
        env:
          SITE_URL: ${{ secrets.INHOUSE_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::INHOUSE_SITE_URL or CRON_SECRET not set — skipping /ranking revalidation (6h cache fallback still applies)"
            exit 0
          fi

          code=$(curl -sS -o /tmp/revalidate.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/revalidate-ranking")

          echo "HTTP $code"
          cat /tmp/revalidate.json || true
          echo ""

          # Best-effort: the stats sync above already succeeded, so a failed
          # revalidation call shouldn't fail the whole run — the 6h fallback
          # covers it either way.
          if [ "$code" != "200" ]; then
            echo "::warning::Revalidation call returned HTTP $code"
          fi
