name: Sync Player Stats

on:
  schedule:
    # 06:00 UTC ≈ 07:00 Poland time (CET, winter). During CEST (summer,
    # UTC+2) this effectively runs at 08:00 local time — GitHub Actions cron
    # has no timezone support, so a ~1h seasonal drift is expected.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-player-stats.mjs
