name: Sync Player Stats

on:
  schedule:
    # Offset 20 minutes after the top-5000 scraper's own 00:00/06:00/12:00/18:00
    # UTC runs (woocash88/dota2-pl-leaderboard). That scraper matches its JSON
    # rows against ours by exact name, and only skips deleting a stale
    # official-only entry when it has a steam_id — so a player renamed since
    # the scraper's last pass (see cleanupRenameGhosts in sync-player-stats.mjs)
    # is briefly a name the scraper won't recognize, and it inserts a fresh
    # ghost duplicate for the old one. Running once a day left that duplicate
    # visible on /ranking for up to ~24h; running shortly after each of the
    # scraper's four passes shrinks that window to well under an hour.
    - cron: '20 0,6,12,18 * * *'
  workflow_dispatch: {}

  # The version of the above that does not rely on a guess, inert until the
  # scraper calls it.
  #
  # Twenty minutes is an estimate about a best-effort scheduler, and :00 is its
  # most congested slot — GitHub makes no promise about when a scheduled run
  # starts, so a badly delayed scraper can still finish after our pass and
  # re-open the window the offset exists to close. A dispatch sent when the
  # scraper *has finished* replaces "probably long enough" with "afterwards".
  #
  # The scraper repo already accepts repository_dispatch from us, so only the
  # reverse call is missing. Add a final step to
  # woocash88/dota2-pl-leaderboard/.github/workflows/update.yml:
  #
  #   - name: Tell the site to re-sync
  #     run: |
  #       curl -X POST -H "Accept: application/vnd.github+json" \
  #         -H "Authorization: Bearer ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}" \
  #         https://api.github.com/repos/Cienszki/dota2-community-site/dispatches \
  #         -d '{"event_type":"leaderboard-updated"}'
  #
  # The token needs only `repo` scope on this repository. The cron above stays
  # as the safety net for a scraper run that fails before reaching that step.
  repository_dispatch:
    types: [leaderboard-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-player-stats.mjs
