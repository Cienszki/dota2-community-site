name: Sync Leaderboard Ranks

on:
  schedule:
    # 00:15 and 12:15 UTC — 15 minutes after woocash88/dota2-pl-leaderboard's
    # own scraper workflow (0 0,12 * * *), giving it time to commit an
    # updated polish_top.json before we pull it.
    - cron: '15 0,12 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-leaderboard-ranks.mjs
